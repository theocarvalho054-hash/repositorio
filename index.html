<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem Vindo!</title>
    
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <link rel="stylesheet" href="./css/index.css">
    
    
</head>
<body>
    <main class="container">
        <h1>Cadastro de Produtos</h1>
        <form action="#" method="post">
            
            <div class="row">
                
                <div class="form-field col-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" name="nome" id="nome" class="form-control" >
                </div>

               
                
                <div class="form-field col-6">
                    <label for="valor" class="form-label">Valor</label>
                    <input type="number" class="form-control" name="valor" id="valor" placeholder="0.00">
                </div>
            </div>

             <div class="row">

                    <div class="col text-center">Esta é a 
                    segunda coluna</div>

                </div>
            
            <div class="row">
                <div class="btn-group botoes col-6">
                    <button type="button" class="btn-solid theme-primary ">Adicionar</button>
                    
                </div>
            </div>
        </form>
        <br>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Valor</th>
                </tr>
            </thead>
            <tbody>
                <!-- <tr>
                    <th scope="row">1</th>
                    <td>Mark</td>
                    <td>Otto</td>
                </tr> -->
            </tbody>
        </table>
        <br>
        <div class="row">
            <div class="text-end">
                Valor total: <span c></span>
            </div>
        </div>
    </main>
</body>
</html>
